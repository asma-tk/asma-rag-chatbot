services:
  - type: web
    name: chatbot-asma
    env: docker
    region: frankfurt
    plan: free
    branch: main
    # Health check pour vérifier que l'application est prête
    healthCheckPath: /health
    # Variables d'environnement
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: CHROMA_PERSIST_DIRECTORY
        value: /opt/render/project/src/chroma_db
      - key: PORT
        value: 10000