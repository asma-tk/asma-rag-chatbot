services:
  - type: web
    name: chatbot-asma
    env: docker
    region: frankfurt
    plan: free
    branch: main
    # Health check pour vérifier que l'application est prête
    healthCheckPath: /health
    # Variables d'environnement
    envVars:
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.1
      - key: CHROMA_PERSIST_DIRECTORY
        value: /opt/render/project/src/chroma_db
      - key: PORT
        value: 10000