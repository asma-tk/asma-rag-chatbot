<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Personnel - Asma Taberkokt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="background-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <div class="avatar">
                    <span class="avatar-text">AT</span>
                </div>
                <div class="header-info">
                    <h1>Assistant Personnel</h1>
                    <p>Découvrez Asma Taberkokt — Développeuse IA</p>
                </div>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">En ligne</span>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div id="typingIndicator" class="typing-indicator d-none">
                <div class="message-avatar"><span>🤖</span></div>
                <div class="message-content">
                    <div class="typing-bubbles">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="userInput" 
                    class="chat-input" 
                    placeholder="Posez votre question ici..."
                    autocomplete="off"
                >
                <button id="sendButton" class="send-button" aria-label="Envoyer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill=\"none\" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2\"></polygon>
                    </svg>
                </button>
            </div>
            <div class="suggestions" id="suggestions">
                <button class="suggestion-chip">Parle-moi de son parcours</button>
                <button class="suggestion-chip">Quelles sont ses compétences ?</button>
                <button class="suggestion-chip">Quels sont ses objectifs ?</button>
                <button class="suggestion-chip">Quelles langues parle-t-elle ?</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
